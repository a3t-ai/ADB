[workspace]
resolver = "2"
members = [
    "crates/adb-core",
    "crates/aql-planner",
    "crates/adb-executor",
    "crates/adb-server",
    "crates/adb-mcp",
    "crates/adb-store",
    "crates/adb-log",
    "crates/adb-sequencer",
    "crates/adb-cluster",
    "crates/adb-raft",
    "crates/adb-cq",
    "crates/adb-gateway",
    "crates/adb-platform",
    "crates/adb-embed",
    "crates/adb-engine",
    "adb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["ADB Contributors"]
repository = "https://github.com/adb/adb"
rust-version = "1.91"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4.44", features = ["serde"] }

# Concurrent data structures
dashmap = "5.5"
parking_lot = "0.12"

# Graph
petgraph = "0.6"

# Vector search
usearch = "2.8"

# Log records: f16 embeddings (S9), ULID ids (D3 S1)
half = { version = "2", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
# Local WAL: record encoding (self-describing, so tagged effects and JSON payloads work) and checksums
rmp-serde = "1"
crc32fast = "1"
tempfile = "3"

# Arrow/DataFusion/Lance: one version line across the workspace, set by Lance
# (pinned exactly: MemWAL option A, ARCHITECTURE.md §9.2). Lance 12 needs
# Rust >= 1.91 and protoc at build time.
arrow = { version = "58", features = ["prettyprint"] }
arrow-array = "58"
arrow-schema = "58"
datafusion = "54"
parquet = "58"
object_store = "0.14"
lance = "=14.0.2"
lance-index = "=14.0.2"

# Parsing
pest = "2.7"
pest_derive = "2.7"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1.7", features = ["v4", "serde"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Testing
criterion = "0.5"
proptest = "1.4"

# Internal crates
adb-core = { path = "crates/adb-core" }
adb-engine = { path = "crates/adb-engine" }
# FlowR's engine rules (stage H): the sibling flowr-system checkout, engine
# modules only (no FlowR types). deploy.sh builds with both repos side by side.
flowr-storage = { path = "../flowr-system/shared/flowr-storage", default-features = false }
# AQL parser comes from the AQL repo (one grammar for AQL and ADB). For local
# development against a sibling checkout, see .cargo/config.toml.example.
aql-parser = { git = "https://github.com/srirammails/AQL.git", branch = "main" }
aql-planner = { path = "crates/aql-planner" }
adb-executor = { path = "crates/adb-executor" }
adb-server = { path = "crates/adb-server" }
adb-mcp = { path = "crates/adb-mcp" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
lto = true
