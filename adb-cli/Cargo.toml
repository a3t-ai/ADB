[package]
name = "adb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ADB command-line interface"

[[bin]]
name = "adb"
path = "src/main.rs"

[dependencies]
adb-server = { path = "../crates/adb-server" }
adb-executor = { path = "../crates/adb-executor" }
adb-mcp = { path = "../crates/adb-mcp" }
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
# `adb import-lancedb`: read a LanceDB directory, send it to ADB over Flight (stage G)
adb-store = { path = "../crates/adb-store" }
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-cast = "58"
arrow-flight = "58"
tonic = "0.14"
futures.workspace = true
# `adb import-flowr-engine`: a FlowR SQLite engine store into an ADB space (stage H-5)
rusqlite = { version = "0.41", features = ["bundled"] }
flowr-storage.workspace = true
chrono.workspace = true
uuid.workspace = true
serde.workspace = true

[dev-dependencies]
tempfile.workspace = true
