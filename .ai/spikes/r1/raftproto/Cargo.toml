[package]
name = "raftproto"
version = "0.1.0"
edition = "2021"

# Standalone spike (R1/R2), not part of the ADB workspace.
[workspace]

[dependencies]
openraft = { version = "=0.10.0-alpha.36", features = ["serde", "type-alias"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
