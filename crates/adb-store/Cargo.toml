[package]
name = "adb-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ADB storage: Lance tables and the MemWAL applier (ARCHITECTURE.md §9, §16)"

[dependencies]
tracing.workspace = true
adb-core.workspace = true
lance.workspace = true
# Lance's object store paths (ostore.rs): the workspace version, as Lance's.
object_store.workspace = true
lance-index.workspace = true
lance-arrow = "=12.0.0"
# Lance 14's own: Arrow JSON (what a plain scan returns) back to Lance JSONB (fold).
lance-arrow-14 = { package = "lance-arrow", version = "=14.0.2" }
lance-datafusion = "=12.0.0"
jsonb = "=0.5.6"
datafusion.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
chrono.workspace = true
half.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# syncfs before the log is purged (risk K8).
tokio.workspace = true
uuid.workspace = true
# Compaction streams the LSM scan (`write_kept`).
futures.workspace = true

[dev-dependencies]
tokio.workspace = true
futures.workspace = true
tempfile.workspace = true
