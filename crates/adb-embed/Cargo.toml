[package]
name = "adb-embed"
version.workspace = true
edition.workspace = true
description = "ADB's text embeddings: bge-small-en-v1.5 on ONNX Runtime (W4), or an OpenAI-compatible endpoint (W9)"

[dependencies]
# ONNX Runtime is fetched at build time (pyke's prebuilt binaries); the model is a
# directory of files, loaded from disk (no Hugging Face access at runtime).
fastembed = { version = "7.5", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
half.workspace = true
# OpenAI-compatible endpoints (W9.10).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true

[dev-dependencies]
axum = "0.7"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
